[workspace]
members = ["crates/*"]
# ocpp-client itself (this manifest) is the workspace root and an implicit member - no need to
# list it. crates/* holds satellite crates that build on ocpp-client's public traits, starting
# with ocpp-transport-embassy-net (see PRODUCTION_READINESS.md item 6). Kept as workspace
# members rather than folded into this crate's own Cargo.toml because they pull in
# embedded-only dependencies (embassy-*) that most consumers of ocpp-client itself don't want.

[package]
edition = '2024'
name = "ocpp-client"
version = "0.2.0-alpha.1"
description = "OCPP Client Implementation. Use this library to implement an OCPP charge point"
repository = "https://github.com/flowionab/ocpp-client"
license = "MIT OR Apache-2.0"
authors = ["Joatin Granlund <joatin@granlund.io>"]
keywords = ["OCPP", "ChargePoint", "Client", "ocpp16", "ocpp201"]

[features]
default = ["std", "tokio-runtime", "websocket", "ocpp_1_6", "ocpp_2_0_1", "ocpp_2_1"]
# Pulls in std/alloc-only support. Forwards to rust-ocpp's own `std` feature (gates its
# validator/regex-based validation), critical-section's `std` backend (gates the mutex
# implementation src/sync.rs's `CriticalSectionRawMutex` uses under the hood), and tracing's
# `std` feature (thread-local span/event dispatch instead of tracing's no_std global-only
# dispatch). Disable for no_std + alloc targets (embedded); the engine itself (src/client.rs)
# has no unconditional std/tokio dependency left - see the `Executor`/`Timer` traits in
# src/runtime.rs. Embedded users must supply their own `Executor`/`Timer` impls plus a
# `critical-section` backend for their target (via `critical_section::set_impl!`), and their
# own `tracing::Subscriber` (e.g. a `defmt`/RTT-backed one) if they want the log output.
std = ["rust-ocpp/std", "critical-section/std", "tracing/std"]
# tokio-backed `Executor`/`Timer` impls (`TokioExecutor`/`TokioTimer`). Implies `std`.
tokio-runtime = ["std", "dep:tokio"]
# WebSocket transport. tokio-tungstenite inherently needs a tokio runtime, so this implies
# `tokio-runtime`.
websocket = ["tokio-runtime", "dep:tokio-tungstenite", "dep:futures", "dep:url", "dep:rustls", "dep:base64"]
ocpp_1_6 = ["rust-ocpp/v1_6"]
ocpp_2_0_1 = ["rust-ocpp/v2_0_1"]
# OCPP 2.1, mirroring src/ocpp_2_0_1/ (see CLAUDE.md). One action, NotifyReport, is missing -
# rust-ocpp's `wip_v2_1::messages::notify_report` module is still empty upstream.
ocpp_2_1 = ["rust-ocpp/wip_v2_1"]
test = []

[dependencies]
# Forked from https://github.com/codelabsab/rust-ocpp to add no_std (alloc-only) support:
# jsonschema/reqwest/hyper/tokio removed entirely, validator/regex made optional and gated
# behind rust-ocpp's own `std` feature. See CLAUDE.md.
rust-ocpp = { git = "https://github.com/flowionab/rust-ocpp", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
uuid = { version = "1", default-features = false, features = ["v4"] }

# no_std+alloc-friendly Mutex/Signal primitives backing src/sync.rs - used unconditionally by
# the engine regardless of the `std`/`tokio-runtime` features.
embassy-sync = { version = "0.8", default-features = false }
critical-section = { version = "1" }

# Only needed for the tokio-backed `Executor`/`Timer` impls (`tokio-runtime` feature) and the
# WebSocket transport, which needs a tokio runtime regardless.
tokio = { version = "1", features = ["sync", "rt", "time"], optional = true }

tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"], optional = true }
futures = { version = "0.3", optional = true }
url = { version = "2.5", optional = true }
rustls = { version = "0.23", optional = true }
base64 = { version = "0.22", optional = true }
tracing = { version = "0.1.44", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
chrono = { version = "^0.4", default-features = false, features = ["now"] }
rcgen = { version = "0.14.8", default-features = false, features = ["aws_lc_rs", "pem"] }
tokio-rustls = "0.26"
tracing-test = { version = "0.2.6", features = ["no-env-filter"] }

