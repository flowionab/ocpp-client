[workspace]
members = ["crates/*"]
# ocpp-client itself (this manifest) is the workspace root and an implicit member - no need to
# list it. crates/* holds satellite crates that build on ocpp-client's public traits, starting
# with ocpp-transport-embassy-net and ocpp-board-stm32h723-nucleo (see
# PRODUCTION_READINESS.md item 6). Kept as workspace members rather than folded into this
# crate's own Cargo.toml because they pull in embedded-only dependencies (embassy-*) that most
# consumers of ocpp-client itself don't want.
#
# default-members is just this root package: neither satellite crate belongs in a plain
# `cargo build`/`test` run here. ocpp-board-stm32h723-nucleo depends on `cortex-m`'s inline
# `asm!`, which only compiles for a real ARM target, so it would fail outright targeting the
# host. ocpp-transport-embassy-net *does* build for the host, but including it as a default
# member made any `cargo <cmd> --features <name>` at the root ambiguous whenever <name> wasn't a
# feature on every default member (e.g. `--features test`, `--features ocpp_1_6` - both
# ocpp-client-only features) - Cargo can't tell which package you meant. Build/check/clippy the
# satellite crates explicitly with `-p <crate>` (see .github/workflows/ci.yaml's `embedded` job
# and each crate's README).
default-members = ["."]

[package]
edition = '2024'
name = "ocpp-client"
version = "0.5.0"
description = "OCPP Client Implementation. Use this library to implement an OCPP charge point"
repository = "https://github.com/flowionab/ocpp-client"
documentation = "https://docs.rs/ocpp-client"
readme = "README.md"
license = "MIT OR Apache-2.0"
authors = ["Joatin Granlund <joatin@granlund.io>"]
# crates.io allows at most five.
keywords = ["ocpp", "charge-point", "ocpp16", "ocpp201", "ocpp21"]
categories = ["network-programming", "embedded", "no-std"]
# What a *consumer* needs to build the library. Verified empirically with
# `cargo +1.87 check --lib --all-features`; the binding constraint is `ocpp-types`, which declares
# the same 1.87, not this crate's own code. Building the test suite needs 1.88 - the `rcgen`/`time`
# dev-dependencies and a let-chain in tests/ - but that only affects contributors, not users.
rust-version = "1.87"
# Keep editor and CI scaffolding out of the published tarball. `.idea/` was shipping inside the
# crate up to 0.2.2.
exclude = [".idea/", ".github/", ".editorconfig"]

# docs.rs builds only default features unless told otherwise, which would hide the `test`-gated
# helpers (`wait_for`, the pending-count accessors) from the rendered docs even though they are
# public API.
[package.metadata.docs.rs]
all-features = true

[features]
default = ["std", "tokio-runtime", "websocket", "ocpp_1_6", "ocpp_2_0_1", "ocpp_2_1"]
# Pulls in std/alloc-only support. Forwards to critical-section's `std` backend (gates the
# mutex implementation src/sync.rs's `CriticalSectionRawMutex` uses under the hood) and
# tracing's `std` feature (thread-local span/event dispatch instead of tracing's no_std
# global-only dispatch). `ocpp-types` needs no forwarding here - its own `alloc` feature is
# unconditionally enabled below regardless of this crate's `std` status, since even the
# no_std+alloc build wants plain `alloc::String`/`Vec` for spec-unbounded fields rather than
# const-generic-sized `heapless` collections (see MIGRATION_OCPP_TYPES.md). That choice is also
# what keeps the message types free of const-generic capacity parameters: `ocpp-types` only
# declares those in its allocation-free shape, so the sole type parameter a consumer of this
# crate ever sees is 2.x's `customData` one. Disable `std` for
# no_std + alloc targets (embedded); the engine itself (src/client.rs) has no unconditional
# std/tokio dependency left - see the `Executor`/`Timer` traits in src/runtime.rs. Embedded
# users must supply their own `Executor`/`Timer` impls plus a `critical-section` backend for
# their target (via `critical_section::set_impl!`), and their own `tracing::Subscriber` (e.g. a
# `defmt`/RTT-backed one) if they want the log output.
std = ["critical-section/std", "tracing/std"]
# tokio-backed `Executor`/`Timer` impls (`TokioExecutor`/`TokioTimer`). Implies `std`.
tokio-runtime = ["std", "dep:tokio"]
# WebSocket transport. tokio-tungstenite inherently needs a tokio runtime, so this implies
# `tokio-runtime`.
websocket = ["tokio-runtime", "dep:tokio-tungstenite", "dep:futures", "dep:url", "dep:rustls", "dep:base64"]
# `ocpp-types` has no per-version cargo features (v16/v201/v21 always compile in), so these
# just gate this crate's own src/ocpp_{1_6,2_0_1,2_1}/ modules.
ocpp_1_6 = []
ocpp_2_0_1 = []
ocpp_2_1 = []
# `From`/`Into` between `ocpp_types::OcppTimestamp` - the type every version's `dateTime` fields
# use since ocpp-types 0.2.0 - and `chrono::DateTime`. Purely additive interop for consumers that
# already keep time in chrono; nothing in this crate needs it, and chrono never reaches the wire
# path (its serde support allocates, which the allocation-free build cannot use).
chrono = ["ocpp-types/chrono"]
# Forwards `ocpp-types`' own `validate`, which adds a `Validate` trait to every message type
# covering the spec constraints the types cannot carry: `maxLength` on fields too large to inline
# as a `heapless::String`, plus every `minItems`/`minimum`/`maximum`/`multipleOf`. On top of that
# it adds `From<ValidationError>` for each version's CALLERROR type.
#
# Nothing in this crate calls `Validate::validate` for you. Validation is not wired into
# `Client::call`, and deliberately so: `Action::Request` would need a `Validate` bound, and a
# bound that appears only when a feature is on is not additive - one crate in the graph enabling
# it would break an unrelated crate's custom `Action` impl (see src/action.rs, which documents
# that trait as open to consumers). Callers validate explicitly, which is one line and composes
# with their own error type. See PRODUCTION_READINESS.md item 5.
validate = ["ocpp-types/validate"]
test = []

[dependencies]
# Strongly typed `no_std` OCPP message types generated from the official JSON schemas - see
# MIGRATION_OCPP_TYPES.md for why this replaced the rust-ocpp fork, and its per-release sections
# at the bottom for what each bump changed. `default-features = false` is deliberate even though
# `alloc` is now upstream's default: the features this crate needs are named explicitly so a
# future default gaining something else doesn't pull it in silently.
#
# 0.3.0 added an opt-in `validate` feature (spec bounds the type system can't carry -
# `maxLength` on fields too large to inline, plus every `minItems`/`minimum`/`maximum`/
# `multipleOf`). This crate forwards it under the same name, off by default; see the `validate`
# entry in [features] above for why nothing calls it automatically.
ocpp-types = { version = "0.3.0", default-features = false, features = ["serde", "alloc"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
uuid = { version = "1", default-features = false, features = ["v4"] }

# no_std+alloc-friendly Mutex/Signal primitives backing src/sync.rs - used unconditionally by
# the engine regardless of the `std`/`tokio-runtime` features.
embassy-sync = { version = "0.8", default-features = false }
critical-section = { version = "1" }

# Only needed for the tokio-backed `Executor`/`Timer` impls (`tokio-runtime` feature) and the
# WebSocket transport, which needs a tokio runtime regardless.
tokio = { version = "1", features = ["sync", "rt", "time"], optional = true }

tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"], optional = true }
futures = { version = "0.3", optional = true }
url = { version = "2.5", optional = true }
rustls = { version = "0.23", optional = true }
base64 = { version = "0.23", optional = true }
tracing = { version = "0.1.44", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
chrono = { version = "^0.4", default-features = false, features = ["now"] }
rcgen = { version = "0.14.8", default-features = false, features = ["aws_lc_rs", "pem"] }
tokio-rustls = "0.26"
tracing-test = { version = "0.2.6", features = ["no-env-filter"] }
criterion = { version = "0.8", features = ["async_tokio"] }

[[bench]]
name = "call_roundtrip"
harness = false

